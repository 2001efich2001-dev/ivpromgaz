<!DOCTYPE html>
<html lang="ru">
<head>
        <link rel="icon" type="image/png" href="image/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оснащение АЗГС — оборудование для газовых заправок</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="nav">
            <a href="#" data-page="home" class="logo-link">
                <img src="images/logo.png" alt="АЗГС Оснащение" class="logo-img">
            </a>
            <ul class="nav-links">
                <li><a data-page="home">Главная</a></li>
                <li><a data-page="catalog">Каталог</a></li>
                <li><a data-page="reviews">Отзывы</a></li>
                <li><a data-page="contacts">Контакты</a></li>
            </ul>
            <div class="cart-icon" id="cartBtn">🛒 Корзина (0)</div>
        </div>
    </div>
</header>

<main id="app">
    <div class="container" id="page-content"></div>
</main>

<footer class="footer">
    <div class="container">
        <p>© 2025 АЗГС Оснащение — оборудование для газовых заправок. Ивановская область, г. Шуя</p>
    </div>
</footer>

<!-- Модальное окно -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <button class="modal-close">&times;</button>
        <div class="modal-body">
            <div class="modal-image">
                <img id="modalImage" src="" alt="">
            </div>
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <div class="modal-price" id="modalPrice"></div>
                <div class="modal-desc" id="modalFullDesc"></div>
                <button class="btn" id="modalAddToCart">🛒 Добавить в корзину</button>
            </div>
        </div>
    </div>
</div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
